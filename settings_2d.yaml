# PyRadiomics settings for the 2D comparisons (src/features_2d.py: xray_2d.py, grape_2d.py).
# Matches settings_3d.yaml except that features are computed in 2D.

setting:
  binCount: 20          # default; --bin-count overrides it (see src/common.py)
  label: 1
  force2D: true         # the image is passed as a single-slice volume
  force2Ddimension: 0   # the slice axis
  resampledPixelSpacing: # no resampling

imageType:
  Original: {}

featureClass:
  shape2D:
  firstorder: []
  glcm:
  glrlm:
  glszm:
  gldm:
  ngtdm:
